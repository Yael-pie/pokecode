<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokécode</title>
    <link rel="stylesheet" href="./src/index.css">
</head>
<body>
    <section id="header">
        <h1 id="titre">Pokécode</h1>
        <h2 id="sous-titre">Que le meilleur gagne !</h2>
    </section>

    <section id="game">
        <div id="joueur-1">
            <h3>Joueur 1</h3>
            <div id="pokemon-1" class="pokemon">
                <img src="./assets/pokemon1.png" class="pokemons-img">
                <p id="pv-1">PV: 100</p>
                <div id="pv-b-1" class="pv-bar"></div>
            </div>
        </div>
        <div id="joueur-2">
            <h3>Joueur 2</h3>
            <div id="pokemon-2" class="pokemon">
                <img src="./assets/pokemon2.png" class="pokemons-img">
                <p id="pv-2">PV: 100</p>
                <div id="pv-b-2" class="pv-bar"></div>
            </div>
        </div>
    </section>

    <script src="./pokecode.js"></script>
    <script src="./src/index.js"></script>
</body>
</html>
